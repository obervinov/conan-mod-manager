---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v
      - name: Build exe
        run: |
          python -m pip install pyinstaller==6.11.1 -r requirements.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name ConanModManager --collect-data sv_ttk main.py
      - name: Smoke check
        shell: pwsh
        run: |
          $exe = Get-Item dist/ConanModManager.exe
          "{0} {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: ConanModManager
          path: dist/ConanModManager.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME}" '$0 ~ "^"v {f=1; next} /^## v/ {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/ConanModManager.exe \
            --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"

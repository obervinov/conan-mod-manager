---
name: Release

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  create-release:
    if: github.event.pull_request.merged == true
    uses: obervinov/_templates/.github/workflows/release.yaml@v4.3.0

  attach-exe:
    needs: [create-release]
    if: github.event.pull_request.merged == true && needs.create-release.outputs.released == 'true'
    uses: obervinov/_templates/.github/workflows/python-windows-exe.yaml@v4.3.0
